name = "zurhaartools-api"
main = "src/index.js"
compatibility_date = "2024-12-01"

[vars]
ALLOWED_ORIGINS = "https://zurhaartools.com,chrome-extension://*"

[[d1_databases]]
binding = "DB"
database_name = "zurhaartools-db"
database_id = "1366e1ef-20c5-4e97-957a-23ec4d03bdca"

# Per-IP rate limit for unauthenticated email-sending endpoints
# (/api/recover, /api/kit/waitlist). namespace_id is an arbitrary
# account-unique identifier for this limit's counter space.
[[unsafe.bindings]]
name = "EMAIL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
